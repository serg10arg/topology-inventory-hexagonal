# ---------------------------------------------------------------------------
# Config de persistencia para el @QuarkusTest del modulo framework (perfil test).
# El modulo framework NO ve la application.properties de bootstrap (las
# dependencias van bootstrap -> framework, no al reves), asi que necesita la suya.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:inventory;DB_CLOSE_DELAY=-1

# Hibernate genera el esquema desde las entidades (clave modernizada en SC2a:
# schema-management.strategy sustituye a la deprecada database.generation).
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Seed explicito. En perfil 'test' import.sql es el default de sql-load-script,
# asi que apuntar al mismo fichero no lo duplica: se ejecuta una sola vez.
quarkus.hibernate-orm.sql-load-script=import.sql
