# ---------------------------------------------------------------------------
# Config de persistencia para el @QuarkusTest del modulo framework (perfil test).
# El modulo framework NO ve la application.properties de bootstrap, asi que necesita la suya.
# ---------------------------------------------------------------------------
# MySQL reactivo via Dev Services: sin url, Quarkus arranca un contenedor MySQL
# (Testcontainers) para el test. REQUIERE Docker corriendo. No hace falta desactivar JDBC:
# al no quedar ninguna extension JDBC en el classpath (fuera agroal y jdbc-h2), Dev Services
# provisiona el datasource reactivo por descarte.
quarkus.datasource.db-kind=mysql
quarkus.datasource.reactive=true

# Hibernate genera el esquema desde las entidades (misma clave moderna que en Fase 7).
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Seed explicito. En perfil 'test' import.sql es el default de sql-load-script; apuntar al
# mismo fichero no lo duplica.
quarkus.hibernate-orm.sql-load-script=import.sql
