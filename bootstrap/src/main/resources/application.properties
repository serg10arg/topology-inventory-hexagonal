# ---------------------------------------------------------------------------
# Persistencia REACTIVA (Fase 8, SC1) - MySQL sobre el cliente no bloqueante de Vert.x.
# ---------------------------------------------------------------------------
# Datasource reactivo. En dev/test NO se fija la url: Quarkus Dev Services levanta un
# contenedor MySQL automaticamente (requiere Docker). En prod (fast-jar) se usa la url del
# perfil %prod, apuntando a un MySQL real.
quarkus.datasource.db-kind=mysql
quarkus.datasource.reactive=true
%prod.quarkus.datasource.reactive.url=mysql://localhost:3306/inventory
%prod.quarkus.datasource.username=root
%prod.quarkus.datasource.password=password

# El DDL lo genera Hibernate desde el metamodelo de entidades. Se conserva la clave moderna
# 'schema-management.strategy' (Fase 7); el prefijo sigue siendo 'quarkus.hibernate-orm.*'
# aunque el motor sea reactivo.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Seed explicito (el default 'import.sql' solo aplica en dev y test; en prod hay que declararlo).
quarkus.hibernate-orm.sql-load-script=import.sql

# Traza del SQL para verificar en SC1 que el DDL y el seed se aplican sobre MySQL reactivo.
quarkus.hibernate-orm.log.sql=true

# ---------------------------------------------------------------------------
# OpenAPI + Swagger UI (Fase 7, SC3) - sin cambios.
# ---------------------------------------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.theme=material
quarkus.swagger-ui.title=Topology & Inventory - Network Management System
quarkus.swagger-ui.display-operation-id=true

mp.openapi.extensions.smallrye.info.title=Topology & Inventory API
mp.openapi.extensions.smallrye.info.version=1.0
mp.openapi.extensions.smallrye.info.description=Gestion de activos de red: routers, switches y redes
