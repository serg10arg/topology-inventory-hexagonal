# ---------------------------------------------------------------------------
# Persistencia gestionada por Quarkus (SC2a) - sustituye a META-INF/persistence.xml
# ---------------------------------------------------------------------------
# Datasource H2 en memoria. DB_CLOSE_DELAY=-1 mantiene viva la base mientras
# haya JVM, no solo mientras haya una conexion abierta.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:inventory;DB_CLOSE_DELAY=-1

# El DDL lo genera Hibernate desde el metamodelo de entidades. Se usa la
# propiedad moderna 'schema-management.strategy': la antigua
# 'hibernate-orm.database.generation' sigue funcionando pero Quarkus 3.33 avisa
# de que esta deprecada.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# El seed se declara EXPLICITAMENTE. El default 'import.sql' solo se aplica en
# los perfiles dev y test; el fast-jar arranca con el perfil prod, donde sin esta
# linea el esquema se crea vacio (verificado: las tres tablas quedaban a 0 filas).
quarkus.hibernate-orm.sql-load-script=import.sql

# Traza del SQL para verificar en SC2a que el DDL se aplica.
# (se retirara o bajara de nivel cuando la fase este cerrada)
quarkus.hibernate-orm.log.sql=true
